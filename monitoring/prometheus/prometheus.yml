global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Will start scraping once these services exist.
  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'keycloak'
    static_configs:
      - targets: ['keycloak:8080']
