# =============================================================
# Data-server compose (operator mode) — served to the data server at
#   $FRAMEWORK_URL/agent/docker-compose.yml
# and fetched by data-agent/install.sh.
#
# Difference vs the in-repo docker-compose.yml: the agent references a
# PUBLISHED image (no local build context exists on a data
# server). The image line is baked by scripts/release.sh — do not
# edit it by hand.
#
# Self-contained: own Postgres, own Keycloak, own bridge net.
# The framework operator has NO admin access to any of it.
# =============================================================

networks:
  agent_net:
    driver: bridge

volumes:
  agent_postgres_data:
  agent_keycloak_data:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_KEYCLOAK_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    volumes:
      - agent_postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    networks:
      - agent_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent:
    image: oof-data-agent:latest   # {{AGENT_IMAGE}} set by scripts/release.sh
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FRAMEWORK_KEY: ${FRAMEWORK_KEY}
    # Loopback only: the agent is reached through the TLS proxy below,
    # never directly. Investigation data and the framework key used to
    # travel over plain HTTP on a public port — this is what closed that.
    ports:
      - "127.0.0.1:${AGENT_PORT:-9000}:9000"
    networks:
      - agent_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start --import-realm --http-relative-path=/auth
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      # -1 = no port in issuer/redirect URLs (proxy on 443). install.sh
      # sets the public port when the proxy listens elsewhere.
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:--1}
      KC_HOSTNAME_STRICT: "false"
      # Keycloak now knows it is public over https (the proxy tells it via
      # X-Forwarded-Proto); investigator passwords no longer cross the
      # network in the clear.
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_CACHE: local
    volumes:
      - agent_keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KC_PORT:-9080}:8080"
    networks:
      - agent_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /auth/realms/master HTTP/1.0\\r\\n\\r\\n' >&3; head -1 <&3 | grep -qE '200|302'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── TLS terminator ────────────────────────────────────────────────
  # Everything customer-facing goes through here. One hostname, one
  # certificate, automatic renewal:
  #   https://<host>/auth/…  → Keycloak  (investigator login)
  #   https://<host>/…       → data agent (framework ingest + queries)
  # Before this existed the installer told the operator to register
  # "http://host:9000", so every ingest push, every graph read and the
  # shared framework key went over the public internet unencrypted.
  proxy:
    image: caddy:2-alpine
    depends_on:
      - agent
      - keycloak
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"     # ACME HTTP-01 challenge + redirect to https
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates + ACME account
      - caddy_config:/config
    networks:
      - agent_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
