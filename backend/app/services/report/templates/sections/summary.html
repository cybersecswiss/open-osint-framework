<h3>{{ S.description }}</h3>
<p>{{ description }}</p>

<h3>{{ S.counts_title }}</h3>
<table>
  <tbody>
  {% for label, n in counts.items() %}
    <tr>
      <td style="width: 60%;">{{ label }}</td>
      <td style="text-align: right; font-weight: 600;">{{ n }}</td>
    </tr>
  {% endfor %}
    <tr>
      <td style="width: 60%;" class="muted">{{ S.data_source }}</td>
      <td style="text-align: right;" class="muted">{{ data_source }}</td>
    </tr>
  </tbody>
</table>
