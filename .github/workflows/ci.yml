name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -S warning -e SC1090,SC1091,SC2034 \
            setup.sh scripts/*.sh scripts/lib/guide.sh data-agent/*.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: type check + production build
        run: npm run build
        working-directory: frontend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `git` mode scans every commit diff, so a secret that was committed and
      # later deleted still fails the build (`dir` would only see the tree).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner

  shared-copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shared files identical in every build context
        run: scripts/check-shared-copies.sh
