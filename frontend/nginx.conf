server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any unknown path returns index.html so the React router can handle it
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Locales as static JSON.
    #
    # `no-cache` means "you may store it, but revalidate before using it" —
    # not "do not store it". With an ETag present that revalidation is a
    # cheap 304, so the cost is one conditional request per language per
    # page load, and the benefit is that a corrected translation is never
    # served from a stale copy.
    #
    # Belt to the braces of the `?v=<build>` parameter the SPA appends: that
    # one handles a normal deploy, this one handles a translation fixed in
    # place (the files are bind-mountable) and anything that requests the
    # bare URL. Both are needed because production sits behind Cloudflare,
    # which caches a 200 JSON response on its own rules.
    location /locales/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Handbook content. A missing page MUST 404 rather than fall through to
    # the SPA: the handbook asks for /wiki/<lang>/<page>.md and falls back to
    # the English original when a translation does not exist yet. With the
    # SPA rule this request would answer 200 with index.html, the fallback
    # would never trigger, and the reader would get raw HTML rendered as
    # Markdown instead of the English text.
    location /wiki/ {
        try_files $uri =404;
        # Same reasoning as /locales/ — the handbook is bind-mounted so it
        # can be extended without a rebuild, which is worthless if the
        # browser keeps the old page.
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
