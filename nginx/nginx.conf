user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;
    server_tokens off;

    # Behind Cloudflare, $remote_addr is the CF edge IP — so every user shares
    # ONE rate-limit bucket, which throttled the whole platform (503 storms on
    # /auth/). Trust CF-Connecting-IP so the limits are per real client again.
    # (Best-effort: trusts the header from any peer. In a hardened prod setup,
    # replace 0.0.0.0/0 with Cloudflare's published IP ranges.)
    real_ip_header    CF-Connecting-IP;
    set_real_ip_from  0.0.0.0/0;
    set_real_ip_from  ::/0;
    real_ip_recursive on;

    # Rates are per client IP (see real_ip above). The OIDC login handshake
    # legitimately fires ~10-20 requests to /auth/ in a couple seconds, and the
    # SPA is chatty on /api/ — so these were far too tight (5r/m throttled every
    # login). Keycloak has its own brute-force protection for actual auth.
    limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=resolve:10m rate=60r/m;
    # Lizenzpruefung eines Kundenservers. Zwei Aufrufe pro Installation und
    # einer je Update — 10/min ist grosszuegig und macht aus dem oeffentlichen
    # /validate trotzdem kein Orakel zum Durchprobieren von Schluesseln.
    limit_req_zone $binary_remote_addr zone=license:10m rate=10r/m;
    # Throttle the Grafana login surface — it was previously unbounded
    # while /api, /auth and /resolve-tenant were all rate-limited.
    limit_req_zone $binary_remote_addr zone=grafana:10m rate=120r/m;

    include /etc/nginx/conf.d/*.conf;
}
