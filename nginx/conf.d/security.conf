add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# No 'unsafe-eval': the built bundle contains no eval( and no
# new Function( , so nothing needs it.
# Content-Security-Policy. Tolerant where it has to be, no further.
#
# `style-src 'unsafe-inline'` stays: Antd injects styles at runtime and
# there is no build that removes that. `connect-src https: wss:` stays: the
# keycloak-js token exchange talks to the data-server KC on a different port,
# i.e. a different origin.
#
# No `script-src 'unsafe-inline'`. The style exception's argument does not
# apply to scripts: the built index.html contains exactly one script tag, an
# external module (`<script type="module" src="/assets/index-*.js">`). The
# directive would permit nothing the app uses, while giving up most of what
# a CSP is for — an injected `<script>alert(1)</script>` would execute.
#
# If a future dependency needs inline script, the answer is a nonce or a
# hash, not this. Symptom to look for: a blank page plus a console line
# "Refused to execute inline script".
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
