# -------------------------------------------------------------------
# Single default_server, no domain-specific routing.
# proxy_pass uses variables so nginx defers DNS resolution to request
# time — this lets the stack start even when api/frontend containers
# are not running yet.
# -------------------------------------------------------------------

# Docker embedded DNS. valid=5s bounds how long a *stale* container IP can
# linger after a `docker compose up --force-recreate` (which gives the
# service a NEW IP): with variable proxy_pass below, nginx re-resolves once
# this TTL lapses, so a recreate self-heals within ~5s instead of serving
# 502s against the old address. resolver_timeout caps a slow lookup so a
# hiccup can't stall a request. For an INSTANT flush after a recreate,
# `scripts/rebuild.sh` reloads nginx (drops this cache immediately).
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

# Host without the :port. n8n's push-websocket origin check compares the
# browser Origin against N8N_HOST (which has NO port) — on e.g. :8443 the
# browser sends "example.org:8443" which never matches "example.org"
# → editor shows "Connection lost". We hand n8n a port-less Origin below.
map $host $host_noport {
    "~^(?<h>[^:]+)" $h;
    default          $host;
}

# HTTP -> HTTPS redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # setup.sh writes https-redirect.inc when HTTPS is not on 443
        # (it then redirects to the right port). The glob include is a
        # no-op when the file does not exist.
        include /etc/nginx/conf.d/*.inc;
        return 301 https://$host$request_uri;
    }
}

# HTTPS — single server block, routes by path
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/conf.d/security.conf;

    # /__status — keep the dev landing page reachable for diagnostics
    # even after the React frontend takes over /.
    location = /__status {
        default_type text/html;
        return 200 '<!doctype html>
<meta charset=utf-8>
<title>OOF — status</title>
<style>
 body{font:14px/1.5 system-ui,sans-serif;max-width:760px;margin:3rem auto;padding:0 1rem;color:#222}
 .tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:3px;margin-left:6px}
 .done{background:#d4edda;color:#155724}
 ul{padding-left:1.2rem}
 li{margin:.25rem 0}
 code{background:#f4f4f4;padding:1px 4px;border-radius:3px;font-size:12.5px}
</style>
<h1>OOF — backend status</h1>
<p>The React frontend is at <a href="/">/</a>. This page is for ops diagnostics.</p>
<h2>Endpoints</h2>
<ul>
  <li><a href="/auth/">/auth/</a> &mdash; Keycloak</li>
  <li><a href="/grafana/">/grafana/</a> &mdash; Grafana</li>
  <li><a href="/api/v1/health">/api/v1/health</a> &mdash; liveness</li>
  <li><a href="/api/v1/health/deep">/api/v1/health/deep</a> &mdash; backend + db</li>
  <li><a href="/api/v1/docs">/api/v1/docs</a> &mdash; Swagger UI</li>
</ul>
';
    }

    # ---------- Lizenzpruefung fuer Kundenserver ----------
    # Der Lizenzserver ist bewusst NICHT veroeffentlicht: er traegt die
    # Mandantenverwaltung und wird sonst nur mit X-Internal-Key gerufen.
    # Ein Kundenserver braucht aber genau zwei seiner Routen, und ohne sie
    # laeuft data-agent/install.sh nicht durch: es ruft
    # /api/v1/license/validate, und das antwortete sonst mit 404.
    #
    # Veroeffentlicht wird deshalb eine EXAKTE Pfadliste, kein Praefix.
    # Beide authentifizieren ueber X-License-Key und geben ausschliesslich
    # die Daten des eigenen Mandanten zurueck; /create bleibt unerreichbar.
    location = /api/v1/license/validate {
        limit_req zone=license burst=5 nodelay;
        set $upstream_license "license:9000";
        proxy_pass http://$upstream_license;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/license/agent-key {
        limit_req zone=license burst=5 nodelay;
        set $upstream_license "license:9000";
        proxy_pass http://$upstream_license;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Data-server delivery ----------
    # data-agent/install.sh fetches these three public files from here to
    # bootstrap a data server. Static, read-only, no directory listing.
    # The data-server release (scripts/release.sh → data-agent/dist/).
    location = /agent/version.json {
        alias /srv/agent-dist/version.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }
    location /agent/ {
        alias /srv/agent-dist/;
        autoindex off;
        default_type text/plain;
        add_header Content-Disposition "inline";
    }

    # ---------- Frontend (React) ----------
    location / {
        set $upstream_frontend "frontend:3000";
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size       32k;
        proxy_buffers           16 32k;
        proxy_busy_buffers_size 64k;
    }

    # Tighter rate-limit on the public email→tenant resolver to slow
    # down email-domain enumeration (login entry point).
    location = /api/v1/resolve-tenant {
        limit_req zone=resolve burst=5 nodelay;
        set $upstream_api "api:8000";
        proxy_pass http://$upstream_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # n8n update pulls an image + recreates the container — can exceed the
    # default 60s. Give this one operator endpoint a long read timeout.
    location = /api/v1/platform/n8n-update {
        set $upstream_api "api:8000";
        proxy_pass http://$upstream_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The pivot preview runs the selected modules SYNCHRONOUSLY (that is the
    # point — the analyst waits, picks hits, then commits). A module call is
    # capped at 300 s backend-side, but nginx's default 60 s read timeout cut
    # it off with a 504 long before that: previewing `infra` on a domain
    # (subfinder + theHarvester + crt.sh …) reliably died. Give this one
    # endpoint the same budget the backend already allows.
    location = /api/v1/search/preview {
        limit_req zone=api burst=10 nodelay;
        set $upstream_api "api:8000";
        proxy_pass http://$upstream_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    # Evidence capture: a real browser loads the page (an onion page up to
    # ~70 s), so the default 60 s would cut it off. The backend bounds the
    # capture at 95 s; this leaves room for the store write.
    location ~ ^/api/v1/cases/[0-9a-fA-F-]+/evidence$ {
        limit_req zone=api burst=10 nodelay;
        set $upstream_api "api:8000";
        proxy_pass http://$upstream_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # ---------- Backend API (FastAPI) ----------
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        set $upstream_api "api:8000";
        proxy_pass http://$upstream_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- WebSocket ----------
    location /ws/ {
        set $upstream_ws "api:8000";
        proxy_pass http://$upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }

    # ---------- Keycloak (Auth) ----------
    # Use the explicit framework-kc alias, not "keycloak". In dev the
    # data-agent's customer KC also lives on this network and resolves
    # the bare "keycloak" name → docker-DNS round-robin would land
    # ~50 % of requests on the wrong KC and 404 the osint realm.
    location /auth/ {
        limit_req zone=login burst=40 nodelay;
        set $upstream_keycloak "framework-kc:8080";
        proxy_pass http://$upstream_keycloak;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        # Keycloak's auth-flow Set-Cookie headers (KC_RESTART JWT etc.)
        # routinely exceed the 8k default and trigger upstream-sent-too-
        # big-header → 502. Bump buffers for the auth path only.
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }

    # ---------- Grafana ----------
    location /grafana/ {
        limit_req zone=grafana burst=20 nodelay;
        set $upstream_grafana "grafana:3000";
        proxy_pass http://$upstream_grafana;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- n8n (operator automation UI) ----------
    # Editor + webhooks live under /n8n/ (n8n has N8N_PATH=/n8n/ set, so
    # the prefix is preserved — do NOT strip it). Needs WebSocket upgrade
    # for the editor's push channel. n8n enforces its own Basic-Auth.
    # ⚠️ Operator-only tool: in production restrict this (IP allow-list /
    # operator auth) — it is not meant to be open on the customer domain.
    # Operator toggle: external n8n access on/off (backend reads the flag
    # from the Owner-panel store). Returns 204=allow / 403=deny. n8n keeps
    # running regardless — only this public route is gated.
    location = /_n8n_gate {
        internal;
        set $gate_api "api:8000";
        proxy_pass http://$gate_api/api/v1/n8n-gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location @n8n_disabled {
        default_type text/html;
        return 403 "<!doctype html><meta charset=utf-8><title>n8n disabled</title><body style=\"font:15px system-ui;max-width:640px;margin:4rem auto;padding:0 1rem\"><h1>n8n external access is disabled</h1><p>The operator has turned off outside access to the n8n editor. Enable it in the Product-Owner console → Settings.</p></body>";
    }

    location = /n8n { return 301 /n8n/; }
    location /n8n/ {
        auth_request /_n8n_gate;
        error_page 403 = @n8n_disabled;
        set $upstream_n8n "n8n:5678";
        # n8n (N8N_PATH=/n8n/) generates asset/webhook URLs WITH the /n8n/
        # prefix but serves the actual files at ROOT (/assets, /static,
        # /rest, /webhook). So strip the prefix before proxying, else every
        # asset request hits n8n's SPA fallback and returns text/html →
        # "Refused to apply/execute … MIME type text/html" → blank editor.
        rewrite ^/n8n/(.*)$ /$1 break;
        proxy_pass http://$upstream_n8n;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  "8443";
        # Rewrite the Origin to the port-less host so n8n's push-websocket
        # origin check matches N8N_HOST (fixes "Connection lost" on :8443).
        proxy_set_header Origin            "https://$host_noport";
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout      3600s;
        # The strict global CSP (security.conf) blanks the n8n editor — its
        # SPA needs data:/blob: scripts + blob web-workers. Any add_header
        # here cancels the inherited ones, so re-declare a n8n-compatible CSP
        # scoped to this operator-only path (keep clickjacking guards).
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
